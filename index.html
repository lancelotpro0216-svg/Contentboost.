<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContentBoost IA — Mejora tu contenido en segundos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07070F; color: #F0F0FF; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; padding-bottom: 60px; }
  .header { padding: 40px 24px 0; max-width: 640px; margin: 0 auto; }
  .badge { display: inline-block; background: linear-gradient(135deg, #6D28D9, #4F46E5); border-radius: 12px; padding: 6px 14px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; color: #E9D5FF; }
  h1 { font-size: 36px; font-weight: 900; line-height: 1.1; margin-bottom: 12px; background: linear-gradient(135deg, #F0F0FF 0%, #A78BFA 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #666; font-size: 15px; line-height: 1.6; }
  .container { max-width: 640px; margin: 0 auto; padding: 32px 24px 0; }
  .label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 600; display: block; }
  .api-box { background: #0E0E1A; border: 1.5px solid #1E1E30; border-radius: 12px; padding: 16px; margin-bottom: 8px; }
  .api-box input { width: 100%; background: transparent; border: none; color: #A78BFA; font-size: 13px; outline: none; font-family: monospace; }
  .api-hint { font-size: 11px; color: #444; margin-bottom: 20px; line-height: 1.5; }
  .api-hint a { color: #7C3AED; text-decoration: none; }
  .platforms { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .platform-btn { padding: 8px 16px; border-radius: 8px; border: 1.5px solid #1E1E30; background: #0E0E1A; color: #555; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .platform-btn.active { border-color: #7C3AED; background: rgba(124,58,237,0.15); color: #A78BFA; }
  textarea { width: 100%; background: #0E0E1A; border: 1.5px solid #1E1E30; border-radius: 12px; padding: 16px; color: #F0F0FF; font-size: 14px; line-height: 1.6; resize: vertical; outline: none; font-family: inherit; margin-bottom: 16px; transition: border-color 0.15s; }
  textarea:focus { border-color: #7C3AED; }
  .cta { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, #7C3AED, #4F46E5); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; font-family: inherit; transition: opacity 0.2s; }
  .cta:disabled { background: #1a1a2e; color: #333; cursor: not-allowed; }
  .error { margin-top: 16px; padding: 14px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: #FCA5A5; font-size: 13px; }
  .results { margin-top: 28px; }
  .card { background: #0E0E1A; border: 1.5px solid #1E1E30; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card.highlight { border-color: #7C3AED; }
  .card-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 14px; }
  .card.highlight .card-label { color: #7C3AED; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .copy-btn { background: rgba(124,58,237,0.15); border: 1px solid #7C3AED; border-radius: 6px; padding: 5px 12px; color: #A78BFA; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .copy-btn.copied { background: rgba(16,185,129,0.15); border-color: #10B981; color: #10B981; }
  .improved-text { color: #E0E0FF; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .hook-text { color: #C4B5FD; font-size: 14px; line-height: 1.7; font-style: italic; }
  .score-label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .score-label span:first-child { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .score-bar-bg { height: 4px; background: #1a1a2e; border-radius: 2px; margin-bottom: 10px; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
  .tip-item { display: flex; gap: 12px; margin-bottom: 12px; }
  .tip-item:last-child { margin-bottom: 0; }
  .tip-num { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; background: rgba(124,58,237,0.2); border: 1px solid #7C3AED; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #A78BFA; margin-top: 1px; }
  .tip-text { color: #999; font-size: 13px; line-height: 1.6; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <div class="badge">IA · Contenido</div>
  <h1>Tu contenido,<br>pero que convierte.</h1>
  <p class="subtitle">Pega tu post. Elige la red. Obtén una versión que la gente quiera compartir.</p>
</div>
<div class="container">
  <div style="margin-bottom:20px">
    <span class="label">Tu API Key de Anthropic</span>
    <div class="api-box">
      <input type="password" id="apiKey" placeholder="sk-ant-..." />
    </div>
    <p class="api-hint">
      Gratis en <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> · Tu clave nunca se guarda ni se envía a ningún servidor nuestro.
    </p>
  </div>
  <div style="margin-bottom:20px">
    <span class="label">Red social</span>
    <div class="platforms" id="platforms">
      <button class="platform-btn active" data-platform="Instagram">📸 Instagram</button>
      <button class="platform-btn" data-platform="TikTok">🎵 TikTok</button>
      <button class="platform-btn" data-platform="X / Twitter">𝕏 Twitter</button>
      <button class="platform-btn" data-platform="LinkedIn">💼 LinkedIn</button>
      <button class="platform-btn" data-platform="Facebook">👥 Facebook</button>
    </div>
  </div>
  <div style="margin-bottom:0">
    <span class="label">Tu contenido actual</span>
    <textarea id="userContent" rows="5" placeholder="Pega aquí tu caption, post, o descripción..."></textarea>
  </div>
  <button class="cta" id="improveBtn" onclick="improve()">⚡ Mejorar contenido</button>
  <div id="errorBox" style="display:none" class="error"></div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
let selectedPlatform = "Instagram";
document.querySelectorAll('.platform-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedPlatform = btn.dataset.platform;
  });
});
const SYSTEM_PROMPT = `Eres un experto en marketing digital y contenido para redes sociales con 10 años de experiencia haciendo crecer cuentas. Tu trabajo es transformar contenido mediocre en contenido que genera engagement real.

Cuando el usuario te dé un texto y una plataforma, responde ÚNICAMENTE con un objeto JSON válido con esta estructura exacta:
{
  "improved": "el contenido reescrito completamente mejorado",
  "hook": "una alternativa de gancho/primera línea más poderosa",
  "tips": ["tip específico 1", "tip específico 2", "tip específico 3"],
  "score_before": número del 1 al 10 del contenido original,
  "score_after": número del 1 al 10 del contenido mejorado
}

Reglas:
- Reescribe completamente, no solo corrijas
- Adapta el tono y formato específicamente a la plataforma
- Los tips deben ser accionables y específicos, no genéricos
- Usa emojis donde corresponde según la plataforma
- Para Instagram/TikTok: más dinámico y cercano
- Para LinkedIn: profesional pero humano
- Para Twitter/X: conciso y con impacto inmediato
- NO incluyas explicaciones fuera del JSON, solo el JSON`;

async function improve() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const content = document.getElementById('userContent').value.trim();
  const btn = document.getElementById('improveBtn');
  const errorBox = document.getElementById('errorBox');
  const results = document.getElementById('results');
  if (!apiKey) { showError("Ingresa tu API Key de Anthropic primero."); return; }
  if (!content) { showError("Escribe o pega tu contenido primero."); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Analizando y mejorando...';
  errorBox.style.display = 'none';
  results.style.display = 'none';
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: `Plataforma: ${selectedPlatform}\n\nContenido original:\n${content}` }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content?.map(b => b.text || '').join('') || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    showResults(parsed);
  } catch(e) {
    showError("Error: " + (e.message || "Algo salió mal. Verifica tu API Key."));
  } finally {
    btn.disabled = false;
    btn.innerHTML = '⚡ Mejorar contenido';
  }
}
function showError(msg) {
  const errorBox = document.getElementById('errorBox');
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}
function showResults(r) {
  const results = document.getElementById('results');
  results.innerHTML = `
    <div class="card">
      <div class="card-label">📊 Análisis</div>
      <div class="score-label"><span>Antes</span><span style="font-size:13px;font-weight:700;color:#EF4444">${r.score_before}/10</span></div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${r.score_before*10}%;background:#EF4444"></div></div>
      <div class="score-label"><span>Después</span><span style="font-size:13px;font-weight:700;color:#10B981">${r.score_after}/10</span></div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${r.score_after*10}%;background:#10B981"></div></div>
    </div>
    <div class="card highlight">
      <div class="card-header">
        <div class="card-label" style="margin-bottom:0">✨ Versión mejorada</div>
        <button class="copy-btn" id="copyBtn" onclick="copyText()">Copiar</button>
      </div>
      <p class="improved-text" id="improvedText">${escapeHtml(r.improved)}</p>
    </div>
    <div class="card">
      <div class="card-label">🎯 Gancho alternativo</div>
      <p class="hook-text">"${escapeHtml(r.hook)}"</p>
    </div>
    <div class="card">
      <div class="card-label">💡 Qué cambié y por qué</div>
      ${r.tips.map((t,i) => `
        <div class="tip-item">
          <div class="tip-num">${i+1}</div>
          <p class="tip-text">${escapeHtml(t)}</p>
        </div>
      `).join('')}
    </div>
  `;
  results.style.display = 'block';
  window._improvedText = r.improved;
}
function copyText() {
  if (!window._improvedText) return;
  navigator.clipboard.writeText(window._improvedText).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 2000);
  });
}
function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
